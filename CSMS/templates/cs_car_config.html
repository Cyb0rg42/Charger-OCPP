{% extends "cs_base.html" %}
{% block content %}
<h2 class="section-title">Car Configuration</h2>

<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title text-white mb-3">Add New Car</h5>
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label for="car-brand" class="form-label text-white">Brand</label>
        <input type="text" class="form-control" id="car-brand" placeholder="e.g. Tesla"
               style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
      </div>
      <div class="col-md-3">
        <label for="car-model" class="form-label text-white">Model</label>
        <input type="text" class="form-control" id="car-model" placeholder="e.g. Model 3"
               style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
      </div>
      <div class="col-md-2">
        <label for="car-year" class="form-label text-white">Year</label>
        <input type="number" class="form-control" id="car-year" placeholder="e.g. 2024" min="1990" max="2099"
               style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
      </div>
      <div class="col-md-2">
        <label for="car-kwh" class="form-label text-white">kWh/100km</label>
        <input type="number" class="form-control" id="car-kwh" placeholder="e.g. 15.5" step="0.1" min="0"
               style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
      </div>
      <div class="col-md-2">
        <label for="car-battery" class="form-label text-white">Battery (kWh)</label>
        <input type="number" class="form-control" id="car-battery" placeholder="e.g. 75" step="0.1" min="0"
               style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
      </div>
      <div class="col-md-2">
        <label for="car-plate" class="form-label text-white">License Plate</label>
        <input type="text" class="form-control" id="car-plate" placeholder="e.g. AB-123-CD"
               style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
      </div>
      <div class="col-md-2">
        <button id="btn-add-car" class="btn btn-primary w-100">Add Car</button>
      </div>
    </div>
    <div id="car-add-result" class="mt-2"></div>
  </div>
</div>

<div class="card">
  <div class="card-header">Car List</div>
  <div class="card-body p-0">
    <div style="max-height:520px; overflow-y:auto;">
      <table class="table table-striped table-sm mb-0" id="car-table">
        <thead class="sticky-top">
          <tr><th>Actions</th><th>ID</th><th>Brand</th><th>Model</th><th>Year</th><th>kWh/100km</th><th>Battery (kWh)</th><th>License Plate</th><th>Created</th></tr>
        </thead>
        <tbody id="car-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editCarModal" tabindex="-1" role="dialog" aria-labelledby="editCarLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content" style="background-color: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color);">
      <div class="modal-header" style="border-bottom: 1px solid var(--border-color);">
        <h5 class="modal-title" id="editCarLabel">Edit Car</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-car-id">
        <div class="form-group mb-3">
          <label for="edit-car-brand" class="form-label" style="color: var(--text-primary);">Brand</label>
          <input type="text" class="form-control" id="edit-car-brand"
                 style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
        </div>
        <div class="form-group mb-3">
          <label for="edit-car-model" class="form-label" style="color: var(--text-primary);">Model</label>
          <input type="text" class="form-control" id="edit-car-model"
                 style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
        </div>
        <div class="form-group mb-3">
          <label for="edit-car-year" class="form-label" style="color: var(--text-primary);">Year</label>
          <input type="number" class="form-control" id="edit-car-year" min="1990" max="2099"
                 style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
        </div>
        <div class="form-group mb-3">
          <label for="edit-car-kwh" class="form-label" style="color: var(--text-primary);">kWh/100km</label>
          <input type="number" class="form-control" id="edit-car-kwh" step="0.1" min="0"
                 style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
        </div>
        <div class="form-group mb-3">
          <label for="edit-car-battery" class="form-label" style="color: var(--text-primary);">Battery Capacity (kWh)</label>
          <input type="number" class="form-control" id="edit-car-battery" step="0.1" min="0"
                 style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
        </div>
        <div class="form-group">
          <label for="edit-car-plate" class="form-label" style="color: var(--text-primary);">License Plate</label>
          <input type="text" class="form-control" id="edit-car-plate"
                 style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color);">
        </div>
      </div>
      <div class="modal-footer" style="border-top: 1px solid var(--border-color);">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-save-car">Save Changes</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function escapeHtml(text) {
  if (!text) return '';
  const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
  return String(text).replace(/[&<>"']/g, m => map[m]);
}

function refreshCars() {
  $.getJSON('/api/cars', function(data) {
    const tb = $('#car-body');
    tb.empty();
    if (!data.length) {
      tb.append('<tr><td colspan="9" class="text-center text-muted">No cars added.</td></tr>');
      return;
    }
    data.forEach(function(c) {
      const actions =
        '<button class="btn btn-sm btn-warning me-1" onclick="editCar(' + c.id + ')" title="Edit">✎</button>' +
        '<button class="btn btn-sm btn-danger" onclick="deleteCar(' + c.id + ')" title="Delete">🗑</button>';
      tb.append(
        '<tr>' +
          '<td>' + actions + '</td>' +
          '<td>' + c.id + '</td>' +
          '<td>' + escapeHtml(c.brand) + '</td>' +
          '<td>' + escapeHtml(c.model) + '</td>' +
          '<td>' + c.year + '</td>' +
          '<td>' + c.kwh_per_100km + '</td>' +
          '<td>' + (c.battery_capacity_kwh != null ? c.battery_capacity_kwh : '') + '</td>' +
          '<td>' + escapeHtml(c.license_plate || '') + '</td>' +
          '<td>' + fmtDate(c.created_at) + '</td>' +
        '</tr>'
      );
    });
  });
}

let _carCache = {};

function editCar(id) {
  $.getJSON('/api/cars', function(data) {
    const car = data.find(c => c.id === id);
    if (!car) return;
    $('#edit-car-id').val(car.id);
    $('#edit-car-brand').val(car.brand);
    $('#edit-car-model').val(car.model);
    $('#edit-car-year').val(car.year);
    $('#edit-car-kwh').val(car.kwh_per_100km);
    $('#edit-car-battery').val(car.battery_capacity_kwh != null ? car.battery_capacity_kwh : '');
    $('#edit-car-plate').val(car.license_plate || '');
    new bootstrap.Modal(document.getElementById('editCarModal')).show();
  });
}

$('#btn-save-car').on('click', function() {
  const id = $('#edit-car-id').val();
  $.ajax({
    url: '/api/car/' + id,
    method: 'PUT',
    contentType: 'application/json',
    data: JSON.stringify({
      brand: $('#edit-car-brand').val(),
      model: $('#edit-car-model').val(),
      year: parseInt($('#edit-car-year').val()),
      kwh_per_100km: parseFloat($('#edit-car-kwh').val()),
      battery_capacity_kwh: $('#edit-car-battery').val() === '' ? null : parseFloat($('#edit-car-battery').val()),
      license_plate: $('#edit-car-plate').val()
    }),
    success: function() {
      bootstrap.Modal.getInstance(document.getElementById('editCarModal')).hide();
      refreshCars();
    },
    error: function() { alert('Failed to update car.'); }
  });
});

function deleteCar(id) {
  if (!confirm('Delete this car?')) return;
  $.ajax({
    url: '/api/car/' + id,
    method: 'DELETE',
    success: function() { refreshCars(); },
    error: function() { alert('Failed to delete car.'); }
  });
}

$('#btn-add-car').on('click', function() {
  const brand = $('#car-brand').val().trim();
  const model = $('#car-model').val().trim();
  const year = $('#car-year').val();
  const kwh = $('#car-kwh').val();
  const battery = $('#car-battery').val();
  if (!brand || !model || !year || !kwh) {
    $('#car-add-result').html('<span class="text-danger">All fields are required.</span>');
    return;
  }
  $.ajax({
    url: '/api/car',
    method: 'POST',
    contentType: 'application/json',
    data: JSON.stringify({ brand: brand, model: model, year: parseInt(year), kwh_per_100km: parseFloat(kwh), battery_capacity_kwh: battery === '' ? null : parseFloat(battery), license_plate: $('#car-plate').val().trim() }),
    success: function() {
      $('#car-brand').val('');
      $('#car-model').val('');
      $('#car-year').val('');
      $('#car-kwh').val('');
      $('#car-battery').val('');
      $('#car-plate').val('');
      $('#car-add-result').html('<span class="text-success">Car added.</span>');
      setTimeout(function() { $('#car-add-result').html(''); }, 3000);
      refreshCars();
    },
    error: function(xhr) {
      const msg = xhr.responseJSON ? xhr.responseJSON.error : 'Failed to add car.';
      $('#car-add-result').html('<span class="text-danger">' + escapeHtml(msg) + '</span>');
    }
  });
});

$(document).ready(function() { refreshCars(); });
</script>
{% endblock %}
