{% extends "cs_base.html" %}
{% block content %}

<h2 class="section-title">Event Log</h2>

<!-- Filters Row -->
<div style="display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;">
  <!-- Left side: Filters -->
  <div style="display: flex; gap: 12px; flex: 1; min-width: 360px; flex-wrap: wrap; align-items: center;">
    <input type="text" id="ev-search" placeholder="Search events..." style="padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-tertiary); color: var(--text-primary); font-size: 13px; flex: 0.5; min-width: 200px;">
    <select id="severity-filter" style="padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-tertiary); color: var(--text-primary); font-size: 13px; min-width: 140px;">
      <option value="DEBUG">DEBUG (All)</option>
      <option value="INFO">INFO and up</option>
      <option value="WARNING">WARNING and up</option>
      <option value="ERROR">ERROR only</option>
    </select>
    <select id="ocpp-filter" style="padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-tertiary); color: var(--text-primary); font-size: 13px; min-width: 180px;">
      <option value="">All Commands</option>
    </select>
    <button class="btn btn-primary" id="btn-refresh-events" style="white-space: nowrap;">Refresh</button>
    <button class="btn btn-outline-secondary" id="btn-clear" style="white-space: nowrap; border: 1px solid var(--border-color);">Clear</button>
  </div>
  <div style="display: flex; gap: 8px; align-items: center;">
    <label for="events-per-page" style="margin-bottom:0; font-size:13px;">Per page:</label>
    <select id="events-per-page" class="form-select form-select-sm" style="width:auto; min-width:80px;">
      <option value="15" selected>15</option>
      <option value="30">30</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <button class="btn btn-page-prev btn-sm" id="events-prev">Previous</button>
    <button class="btn btn-page-next btn-sm" id="events-next">Next</button>
    <span id="events-info" class="text-muted" style="font-size:13px;">Loading...</span>
  </div>
</div>

<!-- Events Table -->
<div class="table-container">
  <div style="max-height: 600px; overflow-y: auto;">
    <table class="table">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Charger</th>
          <th>OCPP CMD</th>
          <th>Severity</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody id="ev-body"></tbody>
    </table>
  </div>
</div>

<p id="no-events" class="text-muted text-center py-3 mb-0" style="display:none;">No events found.</p>

<!-- OCPP Payload Modal -->
<div class="modal fade" id="ocppPayloadModal" tabindex="-1" role="dialog" aria-labelledby="ocppPayloadLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content" style="background-color: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color);">
      <div class="modal-header" style="border-bottom: 1px solid var(--border-color);">
        <h5 class="modal-title" id="ocppPayloadLabel">OCPP Message</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <strong>Charge Point:</strong> <span id="modal-cp-id"></span> &nbsp;
          <strong>Command:</strong> <span id="modal-ocpp-cmd"></span> &nbsp;
          <strong>Time:</strong> <span id="modal-timestamp"></span>
        </div>
        <h6 class="text-info mt-3">Request</h6>
        <pre id="modal-request" style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 4px; padding: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 13px;"></pre>
        <h6 class="text-info mt-3">Response</h6>
        <pre id="modal-response" style="background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 4px; padding: 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 13px;"></pre>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function sevBadge(s){const c={'ERROR':'bg-danger','WARNING':'bg-warning text-dark','INFO':'bg-success','DEBUG':'bg-primary'};return '<span class="badge '+(c[s]||'bg-secondary')+'">'+s+'</span>';}

// Load OCPP commands into dropdown on page load
function loadOcppCommands() {
  $.getJSON("/api/ocpp-commands", function(cmds) {
    const select = $("#ocpp-filter");
    cmds.forEach(function(cmd) {
      if (cmd.ocpp_command) {
        select.append('<option value="' + escapeHtml(cmd.ocpp_command) + '">' + escapeHtml(cmd.ocpp_command) + ' (' + cmd.count + ')</option>');
      }
    });
  });
}

var logEventLimit = 15;
var logEventOffset = 0;
var logEventTotal = 0;

function updateEventInfo() {
  var start = logEventTotal === 0 ? 0 : logEventOffset + 1;
  var end = Math.min(logEventOffset + logEventLimit, logEventTotal);
  $("#events-info").text(start + " - " + end + " of " + logEventTotal);
  $("#events-prev").prop("disabled", logEventOffset === 0);
  $("#events-next").prop("disabled", logEventOffset + logEventLimit >= logEventTotal);
}

function loadEvents(query, ocppCommand, severity) {
  let url = "/api/events";
  const params = [
    "limit=" + logEventLimit,
    "offset=" + logEventOffset,
  ];
  if (query) params.push("q=" + encodeURIComponent(query));
  if (ocppCommand) params.push("ocpp_command=" + encodeURIComponent(ocppCommand));
  if (severity) params.push("severity=" + encodeURIComponent(severity));
  if (params.length > 0) url += "?" + params.join("&");
  
  $.getJSON(url, function(result) {
    const evts = result.events || [];
    logEventTotal = result.total || 0;
    updateEventInfo();
    const tb = $("#ev-body"); tb.empty();
    if (evts.length === 0) { $("#no-events").show(); return; }
    $("#no-events").hide();
    evts.forEach(function(ev) {
      var row = $('<tr style="cursor:pointer;">' +
        '<td>'+fmtDate(ev.timestamp)+'</td>' +
        '<td>'+escapeHtml(ev.cp_id||'-')+'</td>' +
        '<td><span class="badge bg-warning text-dark">' + escapeHtml(ev.ocpp_command||'') + '</span></td>' +
        '<td>'+sevBadge(ev.severity)+'</td>' +
        '<td>'+escapeHtml(ev.message)+'</td></tr>'
      );
      row.click(function() { showPayload(ev); });
      tb.append(row);
    });
  });
}

function formatJson(raw) {
  if (!raw) return null;
  try {
    var parsed = JSON.parse(raw);
    return JSON.stringify(parsed, null, 2);
  } catch(e) {
    return raw;
  }
}

function showPayload(ev) {
  $('#modal-cp-id').text(ev.cp_id || '-');
  $('#modal-ocpp-cmd').text(ev.ocpp_command || '-');
  $('#modal-timestamp').text(fmtDate(ev.timestamp));
  var request = formatJson(ev.ocpp_payload) || 'No request payload available.';
  var response = formatJson(ev.ocpp_response) || 'No response payload available.';
  $('#modal-request').text(request);
  $('#modal-response').text(response);
  var modal = new bootstrap.Modal(document.getElementById('ocppPayloadModal'));
  modal.show();
}

$("#btn-refresh-events").click(function(){ 
  logEventOffset = 0;
  loadEvents($("#ev-search").val().trim(), $("#ocpp-filter").val().trim(), $("#severity-filter").val().trim()); 
});
$("#ev-search").on("keypress", function(e){ 
  if(e.which===13) { logEventOffset = 0; loadEvents($(this).val().trim(), $("#ocpp-filter").val().trim(), $("#severity-filter").val().trim()); }
});
$("#ocpp-filter").change(function(){ 
  logEventOffset = 0;
  loadEvents($("#ev-search").val().trim(), $(this).val().trim(), $("#severity-filter").val().trim()); 
});
$("#severity-filter").change(function(){ 
  logEventOffset = 0;
  loadEvents($("#ev-search").val().trim(), $("#ocpp-filter").val().trim(), $(this).val().trim()); 
});
$("#btn-clear").click(function(){ 
  $("#ev-search").val(""); 
  $("#ocpp-filter").val("");
  $("#severity-filter").val("DEBUG");
  logEventOffset = 0;
  loadEvents("", "", "DEBUG"); 
});

$("#events-prev").click(function() {
  if (logEventOffset <= 0) return;
  logEventOffset = Math.max(0, logEventOffset - logEventLimit);
  loadEvents($("#ev-search").val().trim(), $("#ocpp-filter").val().trim(), $("#severity-filter").val().trim());
});
$("#events-next").click(function() {
  if (logEventOffset + logEventLimit >= logEventTotal) return;
  logEventOffset += logEventLimit;
  loadEvents($("#ev-search").val().trim(), $("#ocpp-filter").val().trim(), $("#severity-filter").val().trim());
});
$("#events-per-page").change(function() {
  logEventLimit = parseInt($(this).val(), 10) || 15;
  logEventOffset = 0;
  loadEvents($("#ev-search").val().trim(), $("#ocpp-filter").val().trim(), $("#severity-filter").val().trim());
});

loadOcppCommands();
loadEvents("", "", "DEBUG");
setInterval(function(){ loadEvents($("#ev-search").val().trim(), $("#ocpp-filter").val().trim(), $("#severity-filter").val().trim()); }, 3000);
</script>
{% endblock %}
