{% extends "cs_base.html" %}
{% block content %}
<h2 class="section-title">Number of Unique Users</h2>
<div class="row mb-3">
  <div class="col">
    <div class="card border-info h-100">
      <div class="card-body text-center d-flex flex-column justify-content-center align-items-center">
        <div class="stat-label text-info mb-1" style="font-size: 13px;">Unique Users</div>
        <div class="stat-value text-info" id="stat-unique-users">-</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
$(function() {
  $.getJSON('/api/stats/unique_users', function(data) {
    $('#stat-unique-users').text(data.unique_users || 0);
  });
});
</script>
{% endblock %}
