{% extends "cs_base.html" %}
{% block content %}
<h2 class="section-title">Average Energy per Session</h2>
<div class="row mb-3">
  <div class="col">
    <div class="card border-info h-100">
      <div class="card-body text-center d-flex flex-column justify-content-center align-items-center">
        <div class="stat-label text-info mb-1" style="font-size: 13px;">Average Energy</div>
        <div class="stat-value text-info" id="stat-avg-energy">- kWh</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
$(function() {
  $.getJSON('/api/stats/avg_energy_per_session', function(data) {
    $('#stat-avg-energy').text((data.avg_energy_kwh || 0).toFixed(2) + ' kWh');
  });
});
</script>
{% endblock %}
