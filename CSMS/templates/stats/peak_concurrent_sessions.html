{% extends "cs_base.html" %}
{% block content %}
<h2 class="section-title">Peak Concurrent Sessions</h2>
<div class="row mb-3">
  <div class="col">
    <div class="card border-info h-100">
      <div class="card-body text-center d-flex flex-column justify-content-center align-items-center">
        <div class="stat-label text-info mb-1" style="font-size: 13px;">Peak Concurrent Sessions</div>
        <div class="stat-value text-info" id="stat-peak-concurrent">-</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
$(function() {
  $.getJSON('/api/stats/peak_concurrent_sessions', function(data) {
    $('#stat-peak-concurrent').text(data.peak_sessions || 0);
  });
});
</script>
{% endblock %}
