{% extends "cs_base.html" %}
{% block content %}
<h2 class="section-title">CO₂ Savings</h2>
<div class="row mb-3">
  <div class="col">
    <div class="card border-info h-100">
      <div class="card-body text-center d-flex flex-column justify-content-center align-items-center">
        <div class="stat-label text-info mb-1" style="font-size: 13px;">CO₂ Savings</div>
        <div class="stat-value text-info" id="stat-co2-savings">- kg</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
$(function() {
  $.getJSON('/api/stats/co2_savings', function(data) {
    $('#stat-co2-savings').text((data.co2_kg || 0).toFixed(2) + ' kg');
  });
});
</script>
{% endblock %}
