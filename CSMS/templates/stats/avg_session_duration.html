{% extends "cs_base.html" %}
{% block content %}
<h2 class="section-title">Average Session Duration</h2>
<div class="row mb-3">
  <div class="col">
    <div class="card border-info h-100">
      <div class="card-body text-center d-flex flex-column justify-content-center align-items-center">
        <div class="stat-label text-info mb-1" style="font-size: 13px;">Average Duration</div>
        <div class="stat-value text-info" id="stat-avg-duration">- min</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
$(function() {
  $.getJSON('/api/stats/avg_session_duration', function(data) {
    $('#stat-avg-duration').text((data.avg_duration_minutes || 0).toFixed(1) + ' min');
  });
});
</script>
{% endblock %}
