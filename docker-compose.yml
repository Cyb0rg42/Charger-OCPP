services:
  ocppproxy:
    build: ./OCPPProxy
    container_name: charger-ocppproxy
    ports:
      - "9300:9300"   # web dashboard (config "port")
      - "9310:9310"   # OCPP listen port — charge points connect here
    environment:
      # Seeds the "Default Backend" row on first boot (empty data volume only —
      # doesn't affect it once seeded). Points at csms1's service name rather
      # than 127.0.0.1, which inside this container would mean itself.
      # PROXY_LISTEN_PORT is left at the image default (9310).
      PROXY_DEFAULT_BACKEND_URL: "ws://csms1:9110/ocpp"
    volumes:
      - ./OCPPProxy/config_example.yaml:/config/config.yaml:ro
      - ocppproxy_data:/opt/charger/data
      - ocppproxy_logs:/var/log/charger
    restart: unless-stopped

  # --- CSMS instances ---------------------------------------------------
  # Add more by copying a block, giving it a new name/ports, and pointing
  # it at its own config_instanceN.yaml (web_port/ocpp_port/database_path).

  csms1:
    build: ./CSMS
    container_name: charger-csms1
    ports:
      - "9100:9100"   # web_port
      - "9110:9110"   # ocpp_port
    volumes:
      - ./CSMS/config_instance1.yaml:/config/config.yaml:ro
      - csms1_data:/opt/charger/data
      - csms1_logs:/var/log/charger
    restart: unless-stopped

  csms2:
    build: ./CSMS
    container_name: charger-csms2
    ports:
      - "9200:9200"   # web_port
      - "9210:9210"   # ocpp_port
    volumes:
      - ./CSMS/config_instance2.yaml:/config/config.yaml:ro
      - csms2_data:/opt/charger/data
      - csms2_logs:/var/log/charger
    restart: unless-stopped

  # --- ChargePoint instances ---------------------------------------------
  # Add more the same way, using config_instanceN.json (port/database/logs).

  chargepoint1:
    build: ./ChargePoint
    container_name: charger-chargepoint1
    ports:
      - "9400:9400"   # GUI port from config_instance1.json
    volumes:
      - ./ChargePoint/config_instance1.json:/config/config.json:ro
      - chargepoint1_data:/opt/charger/data
      - chargepoint1_logs:/var/log/charger
    restart: unless-stopped

  chargepoint2:
    build: ./ChargePoint
    container_name: charger-chargepoint2
    ports:
      - "9500:9500"   # GUI port from config_instance2.json
    volumes:
      - ./ChargePoint/config_instance2.json:/config/config.json:ro
      - chargepoint2_data:/opt/charger/data
      - chargepoint2_logs:/var/log/charger
    restart: unless-stopped

volumes:
  ocppproxy_data:
  ocppproxy_logs:
  csms1_data:
  csms1_logs:
  csms2_data:
  csms2_logs:
  chargepoint1_data:
  chargepoint1_logs:
  chargepoint2_data:
  chargepoint2_logs:
